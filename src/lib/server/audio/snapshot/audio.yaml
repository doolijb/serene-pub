# The recommended AUDIO models run by Serene Pub (audio.cpp). Same discipline as recommended.yaml,
# separate file: these are audio.cpp "packages", not Ollama/KoboldCPP pulls. Seeded once from
# audio.cpp's model_specs by tools/from-audiocpp-specs.py, then hand-curated. The app never parses
# a spec: task and family are data HERE.
#
# id: string                audio.cpp package id; also the model id in the server config. Unique.
# name: string              Hugging Face repo the files come from
# revision: string          branch or tag of that repo (main)
# display_name: string      shown on the card
# family: string            audio.cpp family id; must exist in audio-families.yaml
# task: tts | asr | vdes    tts = speech out, asr = speech in, vdes = text-to-speech whose voice is described in prose
# variant: string           optional; qwen3_tts only: customvoice | base | voicedesign
# precision: string         the numeric precision of the files: q8_0 | bf16 | f16 | q4 | orig ... Every entry
#                           carries one (the spec's own 'precision'); a package with several precisions of the
#                           same family+variant is one row with a precision picker. Absent -> the app derives
#                           it from the file name or the id.
# runtime: audiocpp | koboldcpp
#                           optional; who runs the files. Absent = audiocpp. A koboldcpp entry is NOT an
#                           audio.cpp package: audio.cpp's download, enable and server config never see it.
#                           It is offered as a download into KoboldCPP's text models folder.
# files: string[]           repo-relative paths, exactly as audio.cpp's spec lists them. For runtime koboldcpp:
#                           bare file names at the root of the repo (no '/'), the model first, then the codec
#                           file it needs (Qwen3-TTS -> qwen3-tts-tokenizer of the same precision; OuteTTS ->
#                           WavTokenizer; Kokoro -> none)
# target_directory: string  folder the package lives in (under <models>/<tts|asr>/<family>/)
# strip_prefix: string      removed from the front of each file path when it is written
#                           (runtime koboldcpp: omit both - files land flat in KoboldCPP's text models folder,
#                           and the app ignores them if present)
# size_bytes: number        exact total of ALL the files (a koboldcpp entry: model + codec), from the Hugging Face listing (bytes, not GB)
# recommended_vram: number  GB of video memory the package wants; 0 = fine on a CPU
# license: string           the upstream model's licence id, only when verified on its model card
# tags: string[]
# details
#    description: string
#
# tags vocabulary - keep to this list so filtering stays predictable
#   voices:     preset-voices | instruction-voices
#   delivery:   streaming
#   language:   multilingual
#   notice:     opt-in-notice
# preset-voices means a fixed set of named voices; instruction-voices means the voice or its delivery is
# steered by a sentence of prose. multilingual means more than one language in one package.
# opt-in-notice means the card must state its cost (speed, video memory) before it can be turned on.

