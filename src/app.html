<!doctype html>
<html
	data-theme="lamplight"
	data-mode="dark"
	lang="en"
	class="flex h-full flex-col"
>
	<head>
		<meta charset="utf-8" />
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/icon-x16.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/icon-x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="48x48"
			href="%sveltekit.assets%/icon-x48.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="256x256"
			href="%sveltekit.assets%/icon-x256.png"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-x256.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#1b2338" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="flex h-full flex-col">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
