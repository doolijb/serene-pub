name: Docker

# Builds the multi-arch image for every tag and attaches docker-compose.dist.yml
# (pinned to that image) to the tag's GitHub release — the same release
# release.yml and build-android.yml attach to.
#
# Tags (scripts/release-meta.mjs — a plain vX.Y.Z is a release, ANY suffix is a
# pre-release, as in release.yml and build-android.yml):
#
#   Release     (v1.2.3)          → 1.2.3, 1.2, 1, latest
#   Pre-release (v1.2.3-pr-5)     → 1.2.3-pr-5 only
#   Pre-release (v1.2.3-beta)     → 1.2.3-beta only
#
# so `latest`, `1` and `1.2` always resolve to a release image.
on:
    push:
        tags:
            # Matches suffixed tags too: the last * takes "0-pr-1".
            - "v*.*.*"

permissions:
    contents: read

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        timeout-minutes: 240
        permissions:
            contents: write # attaches docker-compose.yml to the release
            packages: write # pushes to ghcr.io

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            # Never interpolate ${{ github.ref_name }} directly into a run:
            # script body (script injection via a crafted tag name) — every
            # step reads it from env.
            - name: Classify the tag
              id: meta
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: node scripts/release-meta.mjs classify "$REF_NAME"

            # The in-app docs compile the SDK's guides, which no npm package
            # carries. Placed inside the build context, where the Dockerfile
            # looks for them (.serene-pub-sdk); never copied into the image.
            - name: SDK docs content
              uses: ./.github/actions/sdk-docs
              with:
                  dest: .serene-pub-sdk

            - name: Set up QEMU (multi-platform support)
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # The exact version always; `latest` and the short major/minor
            # aliases only for a release.
            - name: Generate Docker metadata
              id: docker_meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  flavor: |
                      latest=${{ steps.meta.outputs.make_latest }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}},enable=${{ steps.meta.outputs.make_latest }}
                      type=semver,pattern={{major}},enable=${{ steps.meta.outputs.make_latest }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.docker_meta.outputs.tags }}
                  labels: ${{ steps.docker_meta.outputs.labels }}
                  # Layer cache via GitHub Actions cache (speeds up repeat builds)
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Publish docker-compose.dist.yml to the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  REF_NAME: ${{ github.ref_name }}
                  VERSION: ${{ steps.meta.outputs.version }}
                  MAKE_LATEST: ${{ steps.meta.outputs.make_latest }}
              run: |
                  if [ "$MAKE_LATEST" = "true" ]; then IMAGE_TAG=latest; else IMAGE_TAG="$VERSION"; fi
                  # The tag is attacker-influenced text headed into a sed
                  # replacement: allow only what a version can contain.
                  if ! [[ "$IMAGE_TAG" =~ ^[0-9A-Za-z._-]+$ ]]; then
                    echo "::error::refusing image tag '$IMAGE_TAG'"
                    exit 1
                  fi
                  IMAGE="ghcr.io/$(tr '[:upper:]' '[:lower:]' <<< "$GH_REPO")"
                  sed "s|ghcr.io/doolijb/serene-pub:latest|$IMAGE:$IMAGE_TAG|" \
                    docker-compose.dist.yml > "$RUNNER_TEMP/docker-compose.yml"
                  grep -n "image:" "$RUNNER_TEMP/docker-compose.yml"
                  bash scripts/ensure-release.sh "$REF_NAME"
                  for i in 1 2 3 4 5; do
                    gh release upload "$REF_NAME" "$RUNNER_TEMP/docker-compose.yml" --clobber && exit 0
                    echo "Attempt $i failed, retrying in 30s..."
                    sleep 30
                  done
                  echo "::error::could not attach docker-compose.yml to release $REF_NAME"
                  exit 1
