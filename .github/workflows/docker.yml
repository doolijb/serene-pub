name: Docker

on:
    push:
        tags:
            - "v*.*.*"
            - "v*.*.*-dev"
            - "v*.*.*-alpha"
            - "v*.*.*-beta"
            - "v*.*.*-pr-*"
            - "v*.*.*-rc-*"

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # -------------------------------------------------------
            # Determine whether this tag is a stable release.
            # Stable = vX.Y.Z or vX.Y.Z-beta (beta is a release, not a pre-release).
            # Only stable releases receive the `latest` tag and the
            # short major/minor convenience aliases (e.g. "1", "1.2").
            # -------------------------------------------------------
            - name: Classify release
              id: classify
              env:
                  # Never interpolate ${{ github.ref_name }} directly into a
                  # run: script body — see release.yml's identical fix for
                  # why (script-injection via a crafted tag name).
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  TAG="$REF_NAME"
                  VERSION="${TAG#v}"
                  if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$ ]]; then
                    echo "stable=true" >> "$GITHUB_OUTPUT"
                    echo "compose_tag=latest" >> "$GITHUB_OUTPUT"
                  else
                    echo "stable=false" >> "$GITHUB_OUTPUT"
                    echo "compose_tag=$VERSION" >> "$GITHUB_OUTPUT"
                  fi
                  echo "Tag: $TAG  →  stable=$( [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$ ]] && echo true || echo false )"

                  # docker/metadata-action's type=semver decomposed tags
                  # ({{major}}, {{major}}.{{minor}}) are silently suppressed
                  # whenever the source tag has a semver prerelease part —
                  # even with enable=true — because -beta counts as a
                  # prerelease by strict semver even though this project
                  # treats it as a maturity label. So major/minor are
                  # extracted here as plain literals and fed to explicit
                  # type=raw entries below, which aren't subject to that
                  # suppression.
                  if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+ ]]; then
                    MAJOR="${BASH_REMATCH[1]}"
                    MINOR="${BASH_REMATCH[2]}"
                  fi
                  echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
                  echo "major_minor=$MAJOR.$MINOR" >> "$GITHUB_OUTPUT"

            - name: Set up QEMU (multi-platform support)
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # -------------------------------------------------------
            # Tag strategy:
            #
            #   Stable  (v1.2.3)          → 1.2.3, 1.2, 1, latest
            #   Stable  (v1.2.3-beta)     → 1.2.3-beta, 1.2, 1, latest
            #   Pre-release (v1.2.3-rc-1) → 1.2.3-rc-1         only
            #   Pre-release (v1.2.3-pr-5) → 1.2.3-pr-5         only
            #
            # Beta is treated as a stable release — it receives `latest`
            # and the short major/minor aliases.
            # The major (1) and minor (1.2) aliases are omitted for
            # pre-releases so that "latest", "1", and "1.2" always
            # resolve to a stable image.
            # -------------------------------------------------------
            - name: Generate Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  # latest/{{major}}/{{major}}.{{minor}} are emitted as
                  # explicit type=raw entries (using the literals computed
                  # in the Classify release step above) rather than via
                  # flavor:latest= or type=semver — both of those are
                  # suppressed by docker/metadata-action whenever the tag
                  # has a semver prerelease part (e.g. -beta), which would
                  # silently drop them for this project's beta releases.
                  tags: |
                      type=semver,pattern={{version}}
                      type=raw,value=latest,enable=${{ steps.classify.outputs.stable }}
                      type=raw,value=${{ steps.classify.outputs.major_minor }},enable=${{ steps.classify.outputs.stable }}
                      type=raw,value=${{ steps.classify.outputs.major }},enable=${{ steps.classify.outputs.stable }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Layer cache via GitHub Actions cache (speeds up repeat builds)
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Publish docker-compose.dist.yml to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Both derive from the pushed tag (COMPOSE_TAG is the
                  # classify step's parsed version, still attacker-influenced
                  # content) — never interpolate ${{ }} expressions directly
                  # into a run: script body, since GitHub substitutes them as
                  # raw text before bash parses the script. Routing through
                  # env: makes both safe, ordinary shell variable expansions.
                  REF_NAME: ${{ github.ref_name }}
                  COMPOSE_TAG: ${{ steps.classify.outputs.compose_tag }}
              run: |
                  sed "s|ghcr.io/doolijb/serene-pub:latest|ghcr.io/doolijb/serene-pub:$COMPOSE_TAG|" \
                    docker-compose.dist.yml > /tmp/docker-compose.yml
                  # Retry a few times — release.yml may still be creating the release
                  for i in 1 2 3 4 5; do
                    gh release upload "$REF_NAME" /tmp/docker-compose.yml --clobber && break
                    echo "Attempt $i failed, retrying in 30s..."
                    sleep 30
                  done
