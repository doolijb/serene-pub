name: Build Android APK

# Builds the APK for every tag and attaches it to the tag's GitHub release —
# the same release release.yml and docker.yml attach to. Release vs
# pre-release follows scripts/release-meta.mjs (a plain vX.Y.Z is a release,
# ANY suffix is a pre-release), so this workflow never disagrees with the
# desktop build about what the tag is.
on:
    push:
        tags:
            # Matches suffixed tags too: the last * takes "0-pr-1".
            - "v*.*.*"

permissions:
    contents: read

jobs:
    build-android:
        name: Build Android APK
        runs-on: ubuntu-latest
        timeout-minutes: 90
        permissions:
            contents: write # uploads the APK to the tag's release
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            # Never interpolate ${{ github.ref_name }} directly into a run:
            # script body (script injection via a crafted tag name) — every
            # step reads it from env.
            - name: Classify the tag
              id: meta
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: node scripts/release-meta.mjs classify "$REF_NAME"

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            # The in-app docs compile the SDK's guides, which no npm package
            # carries; this exports SERENE_PUB_SDK_DIR for the build below.
            - name: SDK docs content
              uses: ./.github/actions/sdk-docs

            # No lockfile by design (.npmrc package-lock=false); the SDK comes
            # from npm at package.json's exact pins.
            - name: Install dependencies
              run: |
                  ok=
                  for i in 1 2 3; do
                    if npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then ok=1; break; fi
                    sleep 15
                  done
                  [ -n "$ok" ] || { echo "::error::npm install failed three times"; exit 1; }

            - name: Prepare SvelteKit
              run: npx svelte-kit sync

            - name: Build SvelteKit app
              run: npm run build
              env:
                  NODE_OPTIONS: "--max-old-space-size=4096"

            - name: Prepare production dependencies
              run: |
                  ok=
                  for i in 1 2 3; do
                    if npm install --omit=dev --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then ok=1; break; fi
                    sleep 15
                  done
                  [ -n "$ok" ] || { echo "::error::npm install --omit=dev failed three times"; exit 1; }
                  npm rebuild

            - name: Prepare Android assets
              run: node scripts/build-android.js

            - name: Decode keystore
              env:
                  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  if [ -n "$KEYSTORE_BASE64" ]; then
                    echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
                    echo "Keystore decoded successfully"
                  else
                    echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK will be UNSIGNED, and Android refuses to install an unsigned APK"
                  fi

            - name: Make gradlew executable
              run: chmod +x android/gradlew

            - name: Build Release APK
              env:
                  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              working-directory: android
              run: |
                  # Only set KEYSTORE_FILE if the keystore was actually decoded —
                  # build.gradle treats its mere presence as "sign this build", so
                  # an unconditionally-set env var would make it try to sign with a
                  # keystore that doesn't exist whenever the secrets aren't configured.
                  # Gradle's file() in app/build.gradle resolves relative to the
                  # app/ project directory, so this must be a bare filename, not a
                  # path relative to this step's android/ working directory.
                  if [ -f "app/release.keystore" ]; then
                    export KEYSTORE_FILE=release.keystore
                  fi
                  ./gradlew assembleRelease

            # Signed and unsigned release builds produce differently-named APKs
            # (app-release.apk vs. app-release-unsigned.apk). Exactly one file
            # reaches the release, and an unsigned one says so in its name so
            # nobody downloads an APK their phone will refuse.
            - name: Rename APK
              id: rename_apk
              env:
                  VERSION: ${{ steps.meta.outputs.version }}
              run: |
                  mkdir -p dist
                  OUT=android/app/build/outputs/apk/release
                  if [ -f "$OUT/app-release.apk" ]; then
                    SRC="$OUT/app-release.apk"; DEST="dist/serene-pub-${VERSION}-android.apk"
                  elif [ -f "$OUT/app-release-unsigned.apk" ]; then
                    SRC="$OUT/app-release-unsigned.apk"; DEST="dist/serene-pub-${VERSION}-android-unsigned.apk"
                    echo "::warning::uploading an UNSIGNED APK ($DEST) — set the ANDROID_KEYSTORE_* secrets to ship an installable one"
                  else
                    echo "::error::no release APK found in $OUT/"
                    ls -la "$OUT/" || true
                    exit 1
                  fi
                  cp "$SRC" "$DEST"
                  echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
                  echo "Renamed $SRC -> $DEST ($(du -h "$DEST" | cut -f1))"

            - name: Upload to the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  REF_NAME: ${{ github.ref_name }}
                  APK: ${{ steps.rename_apk.outputs.apk_path }}
              run: |
                  bash scripts/ensure-release.sh "$REF_NAME"
                  for i in 1 2 3; do
                    gh release upload "$REF_NAME" "$APK" --clobber && exit 0
                    sleep 20
                  done
                  echo "::error::could not upload $APK to release $REF_NAME"
                  exit 1
