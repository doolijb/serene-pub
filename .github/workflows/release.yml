name: Build Desktop Releases

# Every tag v<X.Y.Z>[-<suffix>] builds the portable desktop zips for every
# target and attaches them to the tag's GitHub release, which docker.yml and
# build-android.yml attach to as well (one release per tag).
#
# Release vs pre-release (scripts/release-meta.mjs, the one rule all three
# workflows and the SDK's publish.yml share): a plain vX.Y.Z is a release; ANY
# suffix (-pr-N, -rc-N, -alpha, -beta, -dev) is a pre-release, which never
# becomes "Latest" and whose launcher is built with channel=prerelease.
#
# The @serene-pub/* SDK packages install from npm at the exact versions
# package.json pins, so publish the SDK's tag first (CONTRIBUTING.md).
on:
    push:
        tags:
            # Matches suffixed tags too: the last * takes "0-pr-1".
            - "v*.*.*"

permissions:
    contents: read

jobs:
    prepare:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write # creates the draft release
        outputs:
            version: ${{ steps.meta.outputs.version }}
            title: ${{ steps.meta.outputs.title }}
            prerelease: ${{ steps.meta.outputs.prerelease }}
            make_latest: ${{ steps.meta.outputs.make_latest }}
            channel: ${{ steps.meta.outputs.channel }}
            run_tests: ${{ steps.meta.outputs.run_tests }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            # Never interpolate ${{ github.ref_name }} directly into a run:
            # script body — GitHub substitutes it as raw text before bash
            # parses the script, so a crafted tag name could inject commands.
            # Every step reads it from env instead.
            - name: Classify the tag
              id: meta
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: node scripts/release-meta.mjs classify "$REF_NAME"

            # One version source: package.json, baked into the launcher as
            # main.version. The updater refuses a release whose payload
            # version differs from its tag (READY.json), so a release tag that
            # disagrees with package.json would publish a release nobody can
            # update to — refuse it. Pre-releases never update in-app, so for
            # them it is only a warning.
            - name: Check the tag against package.json
              env:
                  VERSION: ${{ steps.meta.outputs.version }}
                  PRERELEASE: ${{ steps.meta.outputs.prerelease }}
              run: |
                  PKG=$(node -p "require('./package.json').version")
                  if [ "$VERSION" != "$PKG" ]; then
                    if [ "$PRERELEASE" = "true" ]; then
                      echo "::warning::tag version $VERSION does not match package.json version $PKG"
                    else
                      echo "::error::tag version $VERSION does not match package.json version $PKG — the updater would refuse this release"
                      exit 1
                    fi
                  fi

            - name: Create the draft release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  REF_NAME: ${{ github.ref_name }}
              run: bash scripts/ensure-release.sh "$REF_NAME"

            # The in-app docs compile the SDK's guides (and its executed
            # examples and playground), which no npm package carries. Fetched
            # and built once here, on Linux, and handed to every build below.
            - name: SDK docs content
              uses: ./.github/actions/sdk-docs
              with:
                  dest: sdk-docs

            - name: Keep the SDK docs content
              uses: actions/upload-artifact@v4
              with:
                  name: sdk-docs
                  path: sdk-docs
                  retention-days: 5
                  if-no-files-found: error

    test:
        # Gates every platform build below on a single, OS-agnostic test run —
        # extracted out of the matrix (rather than re-run per-platform) so a
        # failure here stops the whole release before any build starts.
        needs: prepare
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Fetch the SDK docs content
              uses: actions/download-artifact@v4
              with:
                  name: sdk-docs
                  path: ${{ runner.temp }}/serene-pub-sdk

            - name: Point the docs build at it
              run: echo "SERENE_PUB_SDK_DIR=$RUNNER_TEMP/serene-pub-sdk" >> "$GITHUB_ENV"

            # No lockfile by design (.npmrc package-lock=false): every install
            # resolves fresh; the SDK comes from npm at package.json's exact pins.
            - name: Install dependencies
              run: |
                  ok=
                  for i in 1 2 3; do
                    if npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then ok=1; break; fi
                    sleep 15
                  done
                  [ -n "$ok" ] || { echo "::error::npm install failed three times"; exit 1; }

            - name: Prepare SvelteKit
              run: npx svelte-kit sync

            - name: Run tests
              # Non-blocking, deliberately reversing the earlier "a failure must
              # stop the release" rule. The suite still RUNS and its result is
              # still visible in the job log — this only stops a red result from
              # gating a release, because of test-isolation flakiness rather
              # than product defects (vectorizationQueue.peekBeforeLoad.int.test.ts
              # shares state between its own tests). Restore the gate (drop
              # continue-on-error) once that file is isolated.
              continue-on-error: true
              if: needs.prepare.outputs.run_tests == 'true'
              run: npm test

    build-app:
        # The app is built ONCE, on Linux: build/ is plain JavaScript, the same
        # for every target (the local release recipe made the Windows zip from
        # a Linux build too). The per-OS jobs below add only what is native to
        # their platform: production node_modules, the Node runtime and the
        # launcher.
        needs: prepare
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            NODE_OPTIONS: "--max-old-space-size=4096"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Fetch the SDK docs content
              uses: actions/download-artifact@v4
              with:
                  name: sdk-docs
                  path: ${{ runner.temp }}/serene-pub-sdk

            - name: Point the docs build at it
              run: echo "SERENE_PUB_SDK_DIR=$RUNNER_TEMP/serene-pub-sdk" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: |
                  ok=
                  for i in 1 2 3; do
                    if npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then ok=1; break; fi
                    sleep 15
                  done
                  [ -n "$ok" ] || { echo "::error::npm install failed three times"; exit 1; }

            - name: Prepare SvelteKit
              run: npx svelte-kit sync

            - name: Run typecheck
              # Non-blocking: informational. Errors still surface in the log.
              continue-on-error: true
              run: npm run check

            - name: Build app
              run: npm run build

            - name: Keep the build
              uses: actions/upload-artifact@v4
              with:
                  name: app-build
                  path: build
                  retention-days: 5
                  if-no-files-found: error

    build-and-release:
        needs: [prepare, test, build-app]
        permissions:
            contents: write # uploads assets to the tag's release
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: linux-x64
                      os: ubuntu-latest
                    # linux-arm64 / linux-ppc64 / windows-arm64: GitHub-hosted
                    # runners for these are x64 here and there is no
                    # cross-compile setup, so `npm install` would resolve x64
                    # native optional deps (eg. sharp, which @huggingface/
                    # transformers imports) into a zip labelled for another
                    # arch. Disabled until real cross-compilation is set up.
                    # linux-arm: Node.js ships no armv7l builds.
                    - target: macos-x64
                      # NOT macos-latest: "-latest" is Apple Silicon (arm64),
                      # where npm would resolve arm64 native optional deps into
                      # a "macos-x64" zip. NOT macos-latest-large either (a paid
                      # larger runner). macos-15-intel is the free-tier Intel
                      # runner.
                      os: macos-15-intel
                    - target: macos-arm64
                      os: macos-latest
                    - target: windows-x64
                      os: windows-latest
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        env:
            NODE_OPTIONS: "--max-old-space-size=4096"
            TARGET: ${{ matrix.target }}
            REF_NAME: ${{ github.ref_name }}
        defaults:
            run:
                shell: bash
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Fetch the app build
              uses: actions/download-artifact@v4
              with:
                  name: app-build
                  path: build

            # Production dependencies only, resolved on this OS so every
            # native package is this platform's. Optional peers are not
            # installed (npm skips them), which keeps the SDK CLI's dev-time
            # peers out. No separate cleaner: scripts/prune-dist.js (run by
            # bundle-dist.js on the bundle's copy) strips dev files and foreign
            # binaries. Every script below uses Node built-ins only.
            - name: Install production dependencies
              run: |
                  ok=
                  for i in 1 2 3; do
                    if npm install --omit=dev --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then ok=1; break; fi
                    sleep 15
                  done
                  [ -n "$ok" ] || { echo "::error::npm install --omit=dev failed three times"; exit 1; }
                  npm rebuild

            # ── Toolchain for the launcher and window helper ───────────
            #
            # launcher/build.mjs (owned by the launcher, not this file)
            # builds two binaries per target: the launcher (`serene-pub` /
            # `Serene Pub.exe`; CGO_ENABLED=0 on Linux/Windows, cgo+Cocoa on
            # macOS) and the window helper (`serene-pub-window[.exe]`,
            # webview_go, always cgo, always on its own OS). This job only
            # provides compilers and headers; it never runs `go build` itself.
            # macOS runners carry Xcode's clang and the Cocoa/WebKit SDKs.
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.24"
                  cache-dependency-path: launcher/go.sum

            # The window helper links WebKitGTK. webview_go asks pkg-config
            # for webkit2gtk-4.0, which Ubuntu 24.04 (ubuntu-latest) no
            # longer ships; launcher/pkgconfig/webkit2gtk-4.0.pc aliases it
            # to 4.1. build.mjs prepends that directory itself — it is
            # exported here too so the probe below sees what the build sees.
            - name: Install window-helper build dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
                  echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/launcher/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
                  PKG_CONFIG_PATH="$GITHUB_WORKSPACE/launcher/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" \
                    pkg-config --modversion gtk+-3.0 webkit2gtk-4.0

            # cgo on Windows needs a MinGW-w64 gcc/g++ (webview_go compiles
            # C++). Installed explicitly rather than trusting whatever the
            # runner image happens to carry; GITHUB_PATH puts it first.
            - name: Set up MinGW-w64 (Windows)
              if: runner.os == 'Windows'
              id: msys2
              uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: false
                  path-type: inherit
                  install: mingw-w64-x86_64-gcc

            - name: Put MinGW-w64 on PATH (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              env:
                  MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
              run: |
                  $bin = Join-Path $env:MSYS2_LOCATION "mingw64\bin"
                  & (Join-Path $bin "gcc.exe") --version
                  $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            # Info.plist + favicon.icns (macOS) and install-desktop-shortcut.sh
            # (Linux), rendered from dist-assets/ templates into
            # dist/generated/<target>/. Windows has nothing to render: the
            # .exe's icon and version resource come from build.mjs.
            - name: Render release templates and icons
              run: node scripts/create-executables.js "$TARGET"

            # The Node runtime the bundle ships, checked against nodejs.org's
            # SHASUMS256.txt before it goes anywhere near the zip.
            - name: Download Node.js runtime for the target
              env:
                  NODE_VERSION: v24.18.0
              run: |
                  case "$TARGET" in
                    linux-x64)   ARCHIVE="node-$NODE_VERSION-linux-x64.tar.xz" ;;
                    macos-x64)   ARCHIVE="node-$NODE_VERSION-darwin-x64.tar.gz" ;;
                    macos-arm64) ARCHIVE="node-$NODE_VERSION-darwin-arm64.tar.gz" ;;
                    windows-x64) ARCHIVE="node-$NODE_VERSION-win-x64.zip" ;;
                    *) echo "::error::no Node.js runtime for $TARGET"; exit 1 ;;
                  esac
                  mkdir -p temp-node
                  cd temp-node
                  curl -fsSL --retry 3 -o "$ARCHIVE" "https://nodejs.org/dist/$NODE_VERSION/$ARCHIVE"
                  curl -fsSL --retry 3 -o SHASUMS256.txt "https://nodejs.org/dist/$NODE_VERSION/SHASUMS256.txt"
                  grep "  $ARCHIVE\$" SHASUMS256.txt > expected.txt
                  if command -v sha256sum > /dev/null 2>&1; then sha256sum -c expected.txt; else shasum -a 256 -c expected.txt; fi
                  DIR="${ARCHIVE%.tar.xz}"; DIR="${DIR%.tar.gz}"; DIR="${DIR%.zip}"
                  case "$ARCHIVE" in
                    *.zip) unzip -q "$ARCHIVE"; cp "$DIR/node.exe" ../node.exe ;;
                    *) tar -xf "$ARCHIVE"; cp "$DIR/bin/node" ../node; chmod +x ../node ;;
                  esac
                  cd ..
                  rm -rf temp-node
                  ls -la node node.exe 2> /dev/null || true

            # Channel (§C11): `prerelease` for pre-release tags — the launcher
            # then never applies an update — else `portable`, which every zip
            # is. The tag/package.json check ran in `prepare`.
            - name: Build launcher and window helper for ${{ matrix.target }}
              env:
                  CHANNEL: ${{ needs.prepare.outputs.channel }}
                  COMMIT: ${{ github.sha }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  node launcher/build.mjs --target "$TARGET" --version "$VERSION" \
                    --channel "$CHANNEL" --commit "$COMMIT" --out "dist/launcher/$TARGET"
                  ls -la "dist/launcher/$TARGET"
                  # The baked values, read back (§C7: `--version` prints
                  # "version channel target"). Windows is skipped: the
                  # launcher is a GUI-subsystem binary there.
                  if [ "$RUNNER_OS" != "Windows" ]; then
                    GOT=$("dist/launcher/$TARGET/serene-pub" --version)
                    if [ "$GOT" != "$VERSION $CHANNEL $TARGET" ]; then
                      echo "::error::launcher --version printed '$GOT', expected '$VERSION $CHANNEL $TARGET'"
                      exit 1
                    fi
                  fi

            # Fails if dist/launcher/<target>/ lacks either binary (no shim
            # fallback), and on any dependency licence outside the allowlist
            # (scripts/licenseExpression.js). Writes the Windows bundle's
            # .cmd/.txt/.env.example with CRLF line endings.
            - name: Bundle for ${{ matrix.target }}
              run: node scripts/bundle-dist.js "$TARGET"

            - name: Check dist bundle size
              run: node scripts/check-dist-size.js "$TARGET"

            # Ad-hoc signature over the finished bundle — after the payload is
            # complete, before zipping; nothing may touch the .app after this.
            # Not notarized (see docs/install.md for the first-run unblock).
            # On Apple Silicon an unsigned or broken-seal bundle does not
            # launch at all, so verify here rather than in users' hands. The
            # launcher re-signs the same way after an in-app swap (§C8).
            - name: Check and ad-hoc sign the app bundle (macOS)
              if: runner.os == 'macOS'
              run: |
                  APP="$(ls -d dist/serene-pub-*-"$TARGET"/serene-pub/"Serene Pub.app" | head -1)"
                  if [ -z "$APP" ] || [ ! -d "$APP" ]; then
                    echo "::error::no Serene Pub.app under dist/serene-pub-*-$TARGET/serene-pub"
                    exit 1
                  fi
                  plutil -lint "$APP/Contents/Info.plist"
                  # The .icns is written without iconutil (create-executables.js);
                  # round-trip it through iconutil so a malformed one fails here.
                  iconutil --convert iconset --output "$RUNNER_TEMP/favicon.iconset" "$APP/Contents/Resources/favicon.icns"
                  ls "$RUNNER_TEMP/favicon.iconset"
                  # codesign refuses Finder info / resource forks on any file.
                  xattr -cr "$APP"
                  codesign --force --deep --sign - "$APP"
                  codesign --verify --deep --verbose=2 "$APP"

            # The archive keeps the version in its FILENAME, but its single
            # top-level entry is the unversioned "serene-pub" directory inside
            # the staging directory — never the staging directory itself, which
            # would nest serene-pub-<v>-<target>/<app> for everyone whose
            # extractor creates a folder named after the archive. Unversioned is
            # also what makes "extract the new zip over your old folder" a valid
            # manual upgrade (.env and the database live in the OS data
            # directory, not beside the app).
            - name: Zip dist directory (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  cd dist
                  $distDir = Get-ChildItem -Directory -Name "serene-pub-*-$env:TARGET" | Select-Object -First 1
                  if (-not $distDir) {
                    Write-Error "No directory found matching serene-pub-*-$env:TARGET"
                    Get-ChildItem
                    exit 1
                  }
                  if (-not (Test-Path "$distDir/serene-pub")) {
                    Write-Error "$distDir does not contain a serene-pub directory (scripts/dist-layout.js)"
                    Get-ChildItem $distDir
                    exit 1
                  }
                  cd $distDir
                  Compress-Archive -Path "serene-pub" -DestinationPath "../../serene-pub-$env:REF_NAME-$env:TARGET.zip"

            # Same single unversioned top-level entry as the Windows step above.
            # Linux also gets a .tar.gz, as the local release recipe made.
            - name: Zip dist directory (Unix)
              if: runner.os != 'Windows'
              run: |
                  DIST_DIR=$(cd dist && ls -d serene-pub-*-"$TARGET" 2> /dev/null | head -1)
                  if [ -z "$DIST_DIR" ] || [ ! -d "dist/$DIST_DIR/serene-pub" ]; then
                    echo "::error::no dist/serene-pub-*-$TARGET/serene-pub directory (scripts/dist-layout.js)"
                    ls -la dist
                    exit 1
                  fi
                  # -y keeps the macOS .app bundle's symlinks as symlinks.
                  (cd "dist/$DIST_DIR" && zip -q -r -y "$GITHUB_WORKSPACE/serene-pub-$REF_NAME-$TARGET.zip" serene-pub)
                  if [ "$RUNNER_OS" = "Linux" ]; then
                    tar -czf "serene-pub-$REF_NAME-$TARGET.tar.gz" -C "dist/$DIST_DIR" serene-pub
                  fi
                  ls -la serene-pub-*

            # §C12: `<zip>.sha256` beside every zip, in sha256sum's format
            # ("<64 lowercase hex>  <zip name>\n", ASCII, no BOM). The in-app
            # updater refuses a release without it. Written by one Node
            # implementation on every runner (no pwsh encoding defaults),
            # then checked with the platform's own tool. checksums-<target>.txt
            # feeds the release's SHA256SUMS (the publish job).
            - name: Write the checksums
              run: |
                  ZIP="serene-pub-$REF_NAME-$TARGET.zip"
                  node scripts/bundle-dist.js --checksum "$ZIP"
                  if command -v sha256sum > /dev/null 2>&1; then SUM="sha256sum"; else SUM="shasum -a 256"; fi
                  $SUM -c "$ZIP.sha256"
                  cp "$ZIP.sha256" "checksums-$TARGET.txt"
                  TGZ="serene-pub-$REF_NAME-$TARGET.tar.gz"
                  if [ -f "$TGZ" ]; then $SUM "$TGZ" >> "checksums-$TARGET.txt"; fi
                  cat "checksums-$TARGET.txt"

            - name: Keep the checksums for SHA256SUMS
              uses: actions/upload-artifact@v4
              with:
                  name: checksums-${{ matrix.target }}
                  path: checksums-${{ matrix.target }}.txt
                  retention-days: 5

            # ── Pre-releases ship portable zips ONLY ───────────────────
            #
            # A pre-release zip's launcher is built with channel=prerelease, so
            # it never applies an update. There is no installer, .dmg or
            # AppImage job yet. When one is added it goes BELOW this comment
            # and carries `if: needs.prepare.outputs.prerelease == 'false'`
            # (combined with its platform condition): an installed build looks
            # and behaves like a production one, which a pre-release must not.
            # A new artifact the updater should consume needs its own .sha256.
            #
            # ⚠ The prerelease rule here (any suffix, including -beta) is
            # stricter than the app's own isPrereleaseVersion()
            # (src/lib/shared/utils/releaseChannel.ts) and the launcher's
            # (launcher/internal/version), which still treat `-beta` as a
            # release. Settle that before tagging a -beta.
            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  FILES=(serene-pub-"$REF_NAME"-"$TARGET".zip serene-pub-"$REF_NAME"-"$TARGET".zip.sha256)
                  if [ -f "serene-pub-$REF_NAME-$TARGET.tar.gz" ]; then FILES+=("serene-pub-$REF_NAME-$TARGET.tar.gz"); fi
                  for i in 1 2 3; do
                    gh release upload "$REF_NAME" "${FILES[@]}" --clobber && exit 0
                    sleep 20
                  done
                  echo "::error::could not upload ${FILES[*]} to release $REF_NAME"
                  exit 1

    publish:
        # Runs only when every desktop build above succeeded: SHA256SUMS, then
        # the draft goes public. A failed target leaves the release a draft
        # (with whatever was uploaded) for a maintainer to finish or delete.
        needs: [prepare, build-and-release]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - name: Fetch the checksums
              uses: actions/download-artifact@v4
              with:
                  pattern: checksums-*
                  merge-multiple: true
                  path: checksums

            - name: Upload SHA256SUMS and publish the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  REF_NAME: ${{ github.ref_name }}
                  PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
                  MAKE_LATEST: ${{ needs.prepare.outputs.make_latest }}
              run: |
                  cat checksums/*.txt | sort -k 2 > SHA256SUMS
                  cat SHA256SUMS
                  gh release upload "$REF_NAME" SHA256SUMS --clobber
                  # Pre-releases never become "Latest"; a plain release does.
                  gh release edit "$REF_NAME" --draft=false --prerelease="$PRERELEASE" --latest="$MAKE_LATEST"
                  gh release view "$REF_NAME" --json name,isDraft,isPrerelease,url,assets --jq '{name, isDraft, isPrerelease, url, assets: [.assets[].name]}'
