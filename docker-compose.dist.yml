services:
    serene-pub:
        image: ghcr.io/doolijb/serene-pub:latest
        restart: unless-stopped
        ports:
            - "3000:3000" # Web UI (also serves the realtime /socket.io/ endpoint)
        volumes:
            - serene-pub-data:/data
        environment:
            # Data directory inside the container (matches the volume mount above)
            SERENE_PUB_DATA_DIR: /data

            # HTTP port the web UI listens on (must match the left side of the
            # ports mapping). Realtime updates share this port — Socket.IO is
            # attached to the same server, so there is no second port to map.
            PORT: 3000

            # Disable automatic browser launch (always disabled in containers)
            SERENE_AUTO_OPEN: 1

            # Real-time connections need no origin configuration: an origin
            # whose hostname matches the hostname a request arrived on is
            # always allowed, which covers every normal Docker setup —
            # localhost, a port-mapped host, a LAN IP, or a custom domain.
            # Docker's port mapping is pure TCP and never rewrites the Host
            # header, so the browser's Origin and the Host the app sees are
            # identical. If your reverse proxy rewrites Host to an internal
            # name, set PUBLIC_URL below; its hostname is allowed too.

            # --- Optional overrides ---

            # Session token lifetime in hours (default: 168 = 7 days)
            # USER_TOKEN_EXPIRATION_HOURS: 168

            # Override the directory where AI model caches (transformers) are stored.
            # Defaults to $SERENE_PUB_DATA_DIR/transformers-cache, already inside the volume.
            # TRANSFORMERS_CACHE: /data/transformers-cache

            # KoboldCPP managed-mode binary directory (only needed for managed KoboldCPP).
            # Mount your KoboldCPP binary into the container and set this path.
            # See DOCKER.md for details.
            # KOBOLDCPP_BINARY_DIR: /koboldcpp

            # Running behind a reverse proxy or tunnel? Declare the public URL
            # and which addresses your proxy connects from; everything else
            # (forwarded host/proto/client-IP handling, HTTPS detection, cookie
            # flags) is derived from these two. One upstream is enough: route
            # everything, /socket.io/ included, to PORT — just make sure your
            # proxy forwards the WebSocket upgrade. See docs/hosting.md.
            # PUBLIC_URL: https://serene.example.com
            # TRUSTED_PROXIES: 172.16.0.0/12

volumes:
    serene-pub-data:
